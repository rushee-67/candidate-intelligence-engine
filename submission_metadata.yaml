# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Hybrid ranking pipeline with three core differentiators.
  (1) Title/role embedding anti-stuffing: candidate text blobs
  (title + headline + summary + last 3 role descriptions) are
  encoded with all-MiniLM-L6-v2 and compared against JD
  responsibility sentences — not skill keywords — so keyword
  stuffers with wrong actual roles score low regardless of
  skill list. (2) Skill-trust multiplier: each skill weighted
  by proficiency × endorsement density × duration, so claimed
  expert skills with 0 months are discounted to near zero.
  (3) Consistency-check honeypot filter: profiles flagged on
  2+ of four internal consistency rules (expert skill + 0
  duration, career months vs years mismatch, date span vs
  duration mismatch, education vs first job timeline) are
  excluded entirely. Behavioral signals (recency, response
  rate, interview completion) act as a multiplier floored
  at 0.5 so strong profiles are discounted not zeroed.
  Runtime: 17s on CPU for 100K candidates.

